name: Build Linux Binary

on:
  push:
    branches: [main]

# Every push to main publishes two kinds of asset to the "latest" prerelease:
#
#   pgmg-linux-<arch>              moving pointer, overwritten on every push
#   pgmg-linux-<arch>-<full-sha>   immutable, one per commit, never overwritten
#
# Downstream projects that pin pgmg at a git rev in Cargo.lock download the
# sha-suffixed asset so the CLI they run matches the library they link.
# Never clobber or delete a sha-suffixed asset, and never delete the "latest"
# release itself: doing so would take every pinned asset with it.

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ensure latest release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest \
              --title "Latest Build" \
              --notes "Automatically built from the latest commit on main. Assets named pgmg-linux-<arch> track main; assets suffixed with a commit sha are immutable." \
              --prerelease
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: pgmg-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: pgmg-linux-aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build release binary
        env:
          # Baked into `pgmg --version` by build.rs. Set explicitly so the
          # build does not depend on the checkout's git metadata.
          PGMG_GIT_SHA: ${{ github.sha }}
        run: cargo build --release --features tls

      - name: Check embedded sha matches the commit
        run: |
          out="$(target/release/pgmg --version)"
          echo "$out"
          case "$out" in
            *"${{ github.sha }}"*) ;;
            *) echo "::error::--version does not report ${{ github.sha }}"; exit 1 ;;
          esac

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: target/release/pgmg

      - name: Upload immutable per-commit binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ matrix.asset }}-${{ github.sha }}
        run: |
          # Deliberately no --clobber: once a sha-suffixed asset exists it must
          # never change. A re-run of this workflow for the same commit finds
          # the asset already present and leaves it alone.
          if gh release view latest --json assets -q '.assets[].name' | grep -qx "$ASSET"; then
            echo "$ASSET already uploaded, leaving it untouched"
            exit 0
          fi
          cp target/release/pgmg "$ASSET"
          gh release upload latest "$ASSET"

      - name: Upload moving binary to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/release/pgmg ${{ matrix.asset }}
          gh release upload latest ${{ matrix.asset }} --clobber
